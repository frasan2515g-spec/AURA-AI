<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>AURA AI - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #131314; color: #e3e3e3; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .register-card { background-color: #1e1f20; border: 1px solid #2e2f31; border-radius: 16px; padding: 32px; width: 100%; max-width: 400px; }
    </style>
</head>
<body>
<div class="register-card">
    <h3 class="fw-bold mb-3 text-center">Crear Cuenta</h3>
    <p class="text-secondary text-center mb-4">Regístrate para guardar tu historial de conversaciones</p>
    {% if error %}
        <div class="alert alert-danger py-2" style="font-size:0.85rem;">{{ error }}</div>
    {% endif %}
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input type="text" name="username" class="form-control bg-dark text-light border-secondary" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" name="password" class="form-control bg-dark text-light border-secondary" required>
        </div>
        <button type="submit" class="btn btn-success w-100 fw-bold mt-2">Crear Cuenta</button>
    </form>
    <div class="text-center mt-3">
        <small class="text-secondary">¿Ya tienes cuenta? <a href="/login" class="text-info">Inicia sesión</a></small>
    </div>
</div>
</body>
</html>
